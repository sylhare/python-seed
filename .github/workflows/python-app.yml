# Install dependencies with uv, lint with ruff and run tests with pytest.
# See: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Test with pytest
        # Exit code 5 means "no tests collected" — fine for a fresh fork or a
        # template where the example has been removed, so we don't go red.
        run: |
          uv run pytest || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "No tests collected — ok for a fresh template."
            exit 0
          fi
          exit "${code:-0}"
