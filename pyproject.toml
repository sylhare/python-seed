# Fill in the fields below to make this template your own.
[project]
name = "python-seed-app"
version = "0.1.0"
description = "A simple skeleton to get started on a generic Python app"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["seed", "skeleton", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
]
# Add your runtime dependencies here, e.g. "requests>=2.32".
dependencies = []

[project.scripts]
app = "src.app:main"

[dependency-groups]
# Dev-only tools, installed by `uv sync` but excluded from `uv sync --no-dev`.
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src"

[tool.ruff]
target-version = "py314"
line-length = 120
